services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: game_store
      POSTGRES_USER: game_store
      POSTGRES_PASSWORD: game_store
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game_store -d game_store"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://game_store:game_store@db:5432/game_store
      APP_BASE_URL: http://localhost:8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
